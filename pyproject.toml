[project]
name = "mailbox-autopilot"
version = "0.8.1"
description = "Clean up an IMAP mailbox and draft replies. Never sends mail."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "German Rauhut", email = "german@rauhut.com"}]
dependencies = [
    "click==8.3.3",
    "imap-tools==1.12.1",
    "keyring==25.7.0",
    "pyyaml==6.0.3",
    "requests==2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
]

[project.scripts]
mailbox-autopilot = "mailbox_cleanup.cli:cli"
mailbox-cleanup = "mailbox_cleanup.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailbox_cleanup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: tests that require Docker (Greenmail)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
