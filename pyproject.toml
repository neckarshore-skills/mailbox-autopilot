[project]
name = "mailbox-autopilot"
version = "0.9.0"
description = "Clean up an IMAP mailbox and draft replies. Never sends mail."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "German Rauhut", email = "german@rauhut.com"}]
dependencies = [
    "click==8.3.3",
    "imap-tools==1.12.1",
    "keyring==25.7.0",
    "pyyaml==6.0.3",
    "requests==2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
]

[project.scripts]
mailbox-autopilot = "mailbox_cleanup.cli:cli"
mailbox-cleanup = "mailbox_cleanup.cli:cli"
# the bot's MCP host (#76); it serves only the bot user, never the owner
mailbox-autopilot-host = "mailbox_cleanup.host:main"

[build-system]
# exact, with its dependencies under [tool.uv]: uv builds this project outside the lock
# on every machine that runs bin/mailbox-autopilot (release condition 3, James on #90)
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailbox_cleanup"]

[tool.uv]
# hatchling 1.33.0's dependencies, measured with `uv pip compile` (2026-10-29). No
# required-version here: plugin users run their own uv; CI pins it in the workflow and
# the launcher binds the bot host (#76).
build-constraint-dependencies = [
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: tests that require Docker (Greenmail)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
