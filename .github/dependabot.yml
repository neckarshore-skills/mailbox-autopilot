# Keeps GitHub Actions references current (#270 §3.3 — OpenSSF Scorecard
# Dependency-Update-Tool). Dependabot maintains the SHA pins by proposing
# version bumps as reviewable PRs.
#
# Only the github-actions ecosystem is declared here. The Python dependencies are
# managed with uv (pyproject.toml + uv.lock); Dependabot's uv support is still
# nascent, so the pip/uv ecosystem is deferred to the owner rather than opening
# potentially-broken lockfile PRs. (Deferral is deliberate — an orphaned uv-group
# PR from an earlier config, #3, is handled manually, not by re-enabling uv here.)
#
# Grouping (auto-merge policy 2026-07-10): minor + patch action bumps collapse into
# ONE weekly grouped PR (fewer PRs, atomic merges — self-clears via the auto-merge
# workflow). Majors are grouped into one PR since 2026-10-23 (#296) and stay manual.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # 3-day cooldown (Founder 2026-10-23, dev-environment #296): a release is only
    # proposed once it has been public for 3 days, so a pulled or compromised release
    # has time to be noticed before it is auto-merged. Security updates are not delayed.
    cooldown:
      default-days: 3
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors, grouped (MASCHIN architect 2026-10-23, #296): one PR for this
      # ecosystem's majors instead of one each. Still manual, never auto-merged: the safe
      # class excludes semver-major. LAST so the named groups above keep their own majors.
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
